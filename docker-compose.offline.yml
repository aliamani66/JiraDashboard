version: '3.8'

services:

  # ─── Backend (Port 3001) ─────────────────────────────────────────────
  backend:
    image: jira-dashboard-backend:latest
    container_name: jira-dashboard-backend
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - ./backend.env
    volumes:
      - sqlite_data:/app/data_volume

  # ─── Frontend (Port 5173) ────────────────────────────────────────────
  frontend:
    image: jira-dashboard-frontend:latest
    container_name: jira-dashboard-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sqlite_data:

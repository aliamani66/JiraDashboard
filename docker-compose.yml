version: '3.8'

services:

  # ─── Reverse Proxy (entry point) ────────────────────────────────────
  nginx-proxy:
    build:
      context: ./nginx-proxy
      dockerfile: Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    image: jira-nginx-proxy:latest
    container_name: jira-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # سرتیفیکیت self-signed در volume ذخیره می‌شه
      # تا هر بار دوباره generate نشه
      - ssl_certs:/etc/nginx/ssl
    depends_on:
      - frontend
    networks:
      - jira-net

  # ─── Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    image: jira-dashboard-frontend:latest
    container_name: jira-dashboard-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - jira-net

  # ─── Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    image: jira-dashboard-backend:latest
    container_name: jira-dashboard-backend
    restart: always
    expose:
      - "3001"
    env_file:
      - ./backend/.env
    volumes:
      - sqlite_data:/app/data_volume
    networks:
      - jira-net

volumes:
  sqlite_data:
  ssl_certs:       # نگهداری سرتیفیکیت بین restart‌ها

networks:
  jira-net:
    driver: bridge

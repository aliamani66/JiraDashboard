version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jira-dashboard-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - CORS_ORIGIN=*
    volumes:
      - sqlite_data:/app/data_volume

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jira-dashboard-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sqlite_data:

version: '3.8'

services:

  # ─── Reverse Proxy (entry point: Port 8081 & 8443) ──────────────────
  nginx-proxy:
    build:
      context: ./nginx-proxy
      dockerfile: Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.arvancloud.ir}
    image: jira-nginx-proxy:latest
    container_name: jira-nginx-proxy
    restart: always
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ssl_certs:/etc/nginx/ssl
    depends_on:
      - frontend
    networks:
      - jira-net

  # ─── Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.arvancloud.ir}
    image: jira-dashboard-frontend:latest
    container_name: jira-dashboard-frontend
    restart: always
    expose:
      - "80"
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - jira-net

  # ─── Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.arvancloud.ir}
    image: jira-dashboard-backend:latest
    container_name: jira-dashboard-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=dev-secret-key
      - SYNC_INTERVAL_MINUTES=60
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - JIRA_BASE_URL=https://10.100.71.140:8443
      - JIRA_USERNAME=m.ghafoory
      - JIRA_TOKEN=NzIyMzUzNTMwNDM0OnAHiPl33I/QMs2nYu8GUiTP3d/p
      - JIRA_PROJECT_KEY=
      - JIRA_WAITING_STATUSES=OnHolding,Waiting,On Hold,Wait,Pending
      - CONFLUENCE_BASE_URL=https://10.100.71.140:8443/wiki
      - CONFLUENCE_USERNAME=m.ghafoory
    volumes:
      - sqlite_data:/app/data_volume
    networks:
      - jira-net

volumes:
  sqlite_data:
  ssl_certs:

networks:
  jira-net:
    driver: bridge

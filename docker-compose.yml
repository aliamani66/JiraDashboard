version: '3.8'

services:

  # ─── Reverse Proxy (entry point) ────────────────────────────────────
  nginx-proxy:
    image: ${REGISTRY:-docker.io}/nginx:alpine
    container_name: jira-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      # پوشه SSL — اگر گواهی دارید اینجا mount کنید
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
    networks:
      - jira-net

  # ─── Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    image: jira-dashboard-frontend:latest
    container_name: jira-dashboard-frontend
    restart: always
    expose:
      - "80"           # فقط داخل شبکه Docker، خارجاً بسته
    depends_on:
      - backend
    networks:
      - jira-net

  # ─── Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    image: jira-dashboard-backend:latest
    container_name: jira-dashboard-backend
    restart: always
    expose:
      - "3001"         # فقط داخل شبکه Docker
    env_file:
      - ./backend/.env
    volumes:
      - sqlite_data:/app/data_volume
    networks:
      - jira-net

volumes:
  sqlite_data:

networks:
  jira-net:
    driver: bridge
